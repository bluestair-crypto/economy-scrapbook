<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각이 자라는 경제 스크랩북</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#264335;background:#f5f8f3}*{box-sizing:border-box}body{margin:0}header{background:#e3efe4;padding:26px max(18px,calc((100vw - 900px)/2))}h1{font-size:clamp(23px,4vw,34px);margin:0}header p{margin:8px 0 0;color:#55725e}main{max-width:900px;margin:auto;padding:20px}.card{background:white;border:1px solid #dae5dc;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 4px 14px #25432a0a}button{border:0;border-radius:11px;background:#287650;color:white;font-weight:700;font-size:15px;padding:12px 18px;cursor:pointer}button.secondary{background:#e6eee7;color:#2b5940}button.danger{background:#a64a4a}button:disabled{opacity:.5}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #c7d9cb;border-radius:10px;background:white}textarea{min-height:90px;resize:vertical}label{display:block;font-weight:700;margin:16px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex-shrink:0}.row .grow{flex:1}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.tile{cursor:pointer}.tile img{width:100%;height:155px;object-fit:cover;border-radius:10px}.tag{display:inline-block;background:#e5f0e6;border-radius:99px;padding:5px 10px;font-size:13px}.muted{color:#64766a;font-size:14px}.preview{max-width:100%;max-height:450px;object-fit:contain;border-radius:10px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#b13a3a}#status{min-height:24px}a{color:#246f50}footer{text-align:center;padding:22px;color:#657b6c}@media(max-width:600px){main{padding:12px}.card{padding:16px}.row .grow{flex-basis:100%}}.comment{border-top:1px solid #e2ebe4;padding:12px 0}.comment-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.comment-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}.comment-area{margin-top:25px;border-top:2px solid #e3efe4;padding-top:12px}.comment-area textarea{min-height:75px}.comment-area button{margin-top:8px}.comment-error{color:#b13a3a}</style></head><body><header><h1>🌱 생각이 자라는 경제 스크랩북</h1><p>신문 한 장에서 시작하는 나만의 경제 이야기</p></header><main><div id="status" role="status"></div><section id="login" class="card"><h2>우리의 스크랩북에 들어가기</h2><p class="muted">처음 한 번 로그인하면 같은 브라우저에서 로그인 상태가 유지됩니다.</p><form id="loginForm"><p class="muted">이름을 선택하고 기존 비밀번호를 입력해 주세요.</p><label for="memberSelect">이름</label><select id="memberSelect" required><option value="">이름을 선택해 주세요</option><option value="bluestair@naver.com">유찬</option><option value="bluestair@sen.go.kr">은찬</option><option value="jieun8608@gmail.com">엄마</option><option value="jjh2002jj21@naver.com">아빠</option></select><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">로그인</button></p></form></section><section id="app" class="hidden"><div class="row" style="margin-bottom:18px"><button id="homeBtn" class="secondary">📚 모두 보기</button><button id="newBtn">＋ 새 스크랩</button><span class="grow"></span><span id="identity" class="tag"></span><button id="logoutBtn" class="secondary">로그아웃</button></div><section id="home"><div class="row"><h2>우리의 경제신문</h2><span class="grow"></span><input id="search" style="max-width:280px" placeholder="기사 검색"></div><div id="cards" class="grid"></div></section><section id="editor" class="card hidden"><h2 id="editorTitle">새 스크랩</h2><form id="scrapForm"><label>신문 기사 사진</label><input id="photo" type="file" accept="image/*" capture="environment"><p class="muted">8MB 이하의 사진을 선택해 주세요.</p><img id="preview" class="preview hidden" alt="신문 사진 미리보기"><label>기사 제목 *</label><input id="title" required maxlength="150"><label>이 기사를 고른 이유</label><textarea id="reason"></textarea><label>더 알아본 내용</label><textarea id="research"></textarea><label>참고한 자료 주소</label><input id="source" type="url" placeholder="https://"><label>나의 생각</label><textarea id="thought"></textarea><p class="row"><button id="saveBtn" type="submit">💾 저장하기</button><button id="cancelBtn" type="button" class="secondary">취소</button></p></form></section><section id="detail" class="card hidden"></section></section></main><footer>한 주에 기사 하나, 생각은 차곡차곡 🌿</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.SCRAPBOOK_CONFIG||{};const status=(s,err=false)=>{$('status').textContent=s;$('status').className=err?'error':''};if(!window.supabase||!cfg.url||!cfg.key){status('설정이 필요합니다. config.js에 Supabase 프로젝트 URL과 Publishable key를 입력하세요.',true);return}const db=window.supabase.createClient(cfg.url,cfg.key),bucket='newspaper-images';let user=null,profile=null,role=null,items=[],editing=null,oldPath=null,urls=[];const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const show=s=>{['home','editor','detail'].forEach(x=>$(x).classList.toggle('hidden',x!==s));window.scrollTo(0,0)};const clearUrls=()=>{urls.forEach(URL.revokeObjectURL);urls=[]};const memberNames={'e1a2df11-ce90-4c21-b52a-57d4e3381808':'유찬','7658b9a0-f8fb-402e-b7af-7992c7ca8d90':'은찬','39cd5c60-fa46-4b6a-b6b7-19c1f020d350':'엄마','32c56a7b-10fe-4779-9136-74b93d61c414':'아빠'};const name=author=>({'첫째':'유찬','둘째':'은찬'})[author]||author;async function enter(session){user=session?.user||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user){const {data:member,error:memberError}=await db.from('family_members').select('display_name,role').eq('user_id',user.id).single();if(memberError||!member){status('가족 계정 등록이 필요합니다. 관리자에게 문의해 주세요.',true);$('app').classList.add('hidden');return}profile=member.display_name;role=member.role;$('identity').textContent=profile+(role==='parent'?' · 가족 기록 보기':'의 스크랩');$('newBtn').classList.toggle('hidden',role==='parent');await load()}}async function load(){status('스크랩을 불러오는 중…');const {data,error}=await db.from('scraps').select('*').order('created_at',{ascending:false});if(error){status('불러오기 실패: '+error.message,true);return}items=data||[];await render();status('')}async function signed(path){if(!path)return null;const {data,error}=await db.storage.from(bucket).createSignedUrl(path,3600);if(error)return null;return data.signedUrl}async function render(){const q=$('search').value.toLowerCase();const list=items.filter(x=>[x.title,x.reason,x.research,x.thoughts].join(' ').toLowerCase().includes(q));$('cards').replaceChildren();if(!list.length){$('cards').innerHTML='<div class="card">아직 스크랩이 없어요. 첫 기사를 올려볼까요? 🌱</div>';return}for(const it of list){const el=document.createElement('article');el.className='card tile';el.tabIndex=0;el.setAttribute('role','button');const img=await signed(it.image_path);el.innerHTML=(img?`<img src="${escape(img)}" alt="신문 기사 사진">`:'<div style="font-size:50px">📰</div>')+`<p><span class="tag">${escape(name(it.author))}</span></p><h3>${escape(it.title)}</h3><p class="muted">${escape((it.thoughts||it.research||'').slice(0,80))}</p><p class="muted">${escape(it.created_at?.slice(0,10))}</p>`;el.onclick=()=>detail(it);el.onkeydown=e=>{if(e.key==='Enter')detail(it)};$('cards').append(el)}}async function detail(it){editing=it.id;const img=await signed(it.image_path);$('detail').innerHTML=`<button id="back" class="secondary">← 목록</button><p><span class="tag">${escape(name(it.author))}</span></p><h2>${escape(it.title)}</h2>${img?`<img class="preview" src="${escape(img)}" alt="신문 사진">`:''}${[['기사를 고른 이유',it.reason],['더 알아본 내용',it.research],['나의 생각',it.thoughts]].filter(x=>x[1]).map(([k,v])=>`<h3>${k}</h3><p class="text">${escape(v)}</p>`).join('')}${/^https?:\/\//.test(it.source_url||'')?`<p><a href="${escape(it.source_url)}" target="_blank" rel="noopener noreferrer">참고 자료 열기</a></p>`:''}<div id="owner" class="row"></div><section class="comment-area"><h3>💬 가족 댓글</h3><div id="commentList">댓글을 불러오는 중…</div><form id="commentForm"><label for="commentText">댓글 남기기</label><textarea id="commentText" maxlength="1000" required placeholder="기사에 대한 생각이나 질문을 남겨보세요."></textarea><button id="commentSubmit" type="submit">댓글 등록</button></form><p id="commentStatus" class="comment-error" role="status"></p></section>`;$('back').onclick=()=>show('home');if(role==='child'&&it.user_id===user.id){$('owner').innerHTML='<button id="edit">수정</button><button id="delete" class="danger">삭제</button>';$('edit').onclick=()=>start(it);$('delete').onclick=()=>remove(it)}show('detail');await loadComments(it.id);$('commentForm').onsubmit=e=>submitComment(e,it.id)}async function loadComments(scrapId){const box=$('commentList');if(!box)return;const {data,error}=await db.from('scrap_comments').select('id,user_id,content,created_at').eq('scrap_id',scrapId).order('created_at',{ascending:true});if(!box||!box.isConnected)return;if(error){box.textContent='댓글을 불러오지 못했어요: '+error.message;return}box.replaceChildren();if(!data?.length){box.textContent='아직 댓글이 없어요. 첫 댓글을 남겨보세요!';return}for(const c of data){const item=document.createElement('div');item.className='comment';const head=document.createElement('div');head.className='comment-head';const author=document.createElement('strong');author.textContent=memberNames[c.user_id]||'가족';head.append(author);const time=document.createElement('span');time.className='muted';time.textContent=new Date(c.created_at).toLocaleString('ko-KR');head.append(time);if(c.user_id===user?.id){const del=document.createElement('button');del.type='button';del.className='secondary';del.textContent='내 댓글 삭제';del.onclick=async()=>{if(!confirm('이 댓글을 삭제할까요?'))return;del.disabled=true;const {error}=await db.from('scrap_comments').delete().eq('id',c.id).eq('user_id',user.id);if(error){$('commentStatus').textContent='댓글 삭제 실패: '+error.message;del.disabled=false;return}await loadComments(scrapId)};head.append(del)}const body=document.createElement('p');body.className='comment-body';body.textContent=c.content;item.append(head,body);box.append(item)}}async function submitComment(e,scrapId){e.preventDefault();const content=$('commentText').value.trim(),btn=$('commentSubmit');if(!content)return;btn.disabled=true;$('commentStatus').textContent='';try{const {error}=await db.from('scrap_comments').insert({scrap_id:scrapId,user_id:user.id,content});if(error)throw error;$('commentText').value='';await loadComments(scrapId)}catch(err){$('commentStatus').textContent='댓글 저장 실패: '+err.message}finally{btn.disabled=false}}
async function start(it=null){if(role!=='child'){status('엄마 아빠는 읽기만 할 수 있어요.',true);return}editing=it?.id||null;oldPath=it?.image_path||null;$('scrapForm').reset();$('title').value=it?.title||'';$('reason').value=it?.reason||'';$('research').value=it?.research||'';$('source').value=it?.source_url||'';$('thought').value=it?.thoughts||'';$('editorTitle').textContent=it?'스크랩 수정':'새 스크랩';$('preview').classList.add('hidden');if(oldPath){const img=await signed(oldPath);if(img){$('preview').src=img;$('preview').classList.remove('hidden')}}show('editor')}async function remove(it){if(role!=='child')return;if(!confirm('이 스크랩을 삭제할까요?'))return;const {error}=await db.from('scraps').delete().eq('id',it.id).eq('user_id',user.id);if(error){status('삭제 실패: '+error.message,true);return}if(it.image_path){const {error:photoError}=await db.storage.from(bucket).remove([it.image_path]);if(photoError)status('글은 삭제했지만 사진 정리는 실패했습니다: '+photoError.message,true)}await load();show('home')}async function login(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;status('로그인 중…');try{const {data,error}=await db.auth.signInWithPassword({email:$('memberSelect').value,password:$('password').value});if(error)throw error;$('password').value='';await enter(data.session)}catch(err){status('로그인 실패: '+err.message,true)}finally{btn.disabled=false}}$('loginForm').onsubmit=login;$('logoutBtn').onclick=async()=>{await db.auth.signOut();user=null;role=null;profile=null;items=[];status('');await enter(null)};$('homeBtn').onclick=()=>show('home');$('newBtn').onclick=()=>start();$('cancelBtn').onclick=()=>show('home');$('search').oninput=()=>render();$('photo').onchange=()=>{const f=$('photo').files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>8*1024*1024){alert('8MB 이하의 이미지 파일만 올릴 수 있어요.');$('photo').value='';return}clearUrls();const url=URL.createObjectURL(f);urls.push(url);$('preview').src=url;$('preview').classList.remove('hidden')};$('scrapForm').onsubmit=async e=>{e.preventDefault();if(role!=='child'){status('엄마 아빠는 읽기 전용이에요.',true);return}const btn=$('saveBtn');btn.disabled=true;status('저장 중…');let uploaded=null;try{const f=$('photo').files[0];let path=oldPath;if(f){const ext=(f.type.split('/')[1]||'jpeg').replace(/[^a-z0-9]/gi,'').slice(0,8)||'jpeg';path=user.id+'/'+crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from(bucket).upload(path,f,{contentType:f.type,upsert:false});if(error)throw error;uploaded=path}const record={user_id:user.id,author:profile,title:$('title').value.trim(),reason:$('reason').value.trim(),research:$('research').value.trim(),source_url:$('source').value.trim(),thoughts:$('thought').value.trim(),image_path:path,updated_at:new Date().toISOString()};if(!record.title)throw new Error('제목을 입력해 주세요');const query=editing?db.from('scraps').update(record).eq('id',editing).eq('user_id',user.id):db.from('scraps').insert(record);const {error}=await query;if(error)throw error;if(uploaded&&oldPath){await db.storage.from(bucket).remove([oldPath])}clearUrls();await load();show('home');status('스크랩을 저장했어요! 🌱')}catch(err){if(uploaded)await db.storage.from(bucket).remove([uploaded]);status('저장 실패: '+err.message,true)}finally{btn.disabled=false}};db.auth.getSession().then(({data,error})=>{if(error)status(error.message,true);else enter(data.session)});db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')enter(null)});
})();</script></body></html>
